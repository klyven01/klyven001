<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KLYVEN — MOVE DIFFERENT.</title>
    <meta name="description" content="KLYVEN is premium futuristic oversized streetwear for a generation that moves different. Shop DROP 01 — limited run." />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Open Graph -->
    <meta property="og:title" content="KLYVEN — MOVE DIFFERENT." />
    <meta property="og:description" content="Premium futuristic oversized streetwear. Shop DROP 01 — limited run." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://klyven.netlify.app" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KLYVEN — MOVE DIFFERENT." />
    <meta name="twitter:description" content="Premium futuristic oversized streetwear. Shop DROP 01 — limited run." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-void text-bone font-body antialiased">
    <!-- Hidden static forms so Netlify's form-detection bot can register them at deploy time -->
    <form name="klyven-order-backup" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="orderId" />
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="address" />
      <input type="text" name="items" />
      <input type="text" name="amount" />
      <input type="text" name="paymentMethod" />
      <input type="text" name="bot-field" />
    </form>
    <form name="klyven-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="klyven-newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
