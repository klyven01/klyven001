[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — send every unmatched route to index.html so React Router
# can handle client-side routing (e.g. /product/drop-01-design-01)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
